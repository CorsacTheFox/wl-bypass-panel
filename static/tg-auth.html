<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <title>Authorizing Cors.Connect…</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #08080a;
      color: #d1d5db;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }
    .wrap { width: 100%; max-width: 26rem; }
    .card {
      background: #14141a;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 18px;
      padding: 2.25rem 1.75rem;
      text-align: center;
    }
    .logo {
      width: 3.25rem; height: 3.25rem; border-radius: 14px;
      background: #7c3aed;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.35rem;
      box-shadow: 0 10px 28px rgba(124, 58, 237, 0.28);
    }
    h1 { color: #fff; font-size: 1.2rem; font-weight: 600; margin: 0 0 .5rem; }
    .sub { color: #6b7280; font-size: .82rem; margin: 0 0 1.5rem; line-height: 1.5; }

    .spinner {
      width: 30px; height: 30px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #7c3aed;
      border-radius: 50%;
      margin: 0 auto 1.1rem;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .state-line { color: #9ca3af; font-size: .82rem; margin: 0 0 1.25rem; }
    .error .logo { background: #b91c1c; box-shadow: 0 10px 28px rgba(185, 28, 28, 0.25); }
    .error h1 { margin-bottom: .35rem; }

    .hidden { display: none !important; }

    .btn-action {
      display: inline-block;
      width: 100%;
      padding: 0.9rem 1.25rem;
      background: #7c3aed;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.35);
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .btn-action:active {
      background: #6d28d9;
      transform: scale(0.98);
    }
    /* Лёгкий pulse: кнопка — единственное действие на странице, её должно
       быть видно сразу (пользователь не успевал её заметить до редиректа). */
    #btn-return {
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 4px 14px rgba(124, 58, 237, 0.35); }
      50%      { box-shadow: 0 4px 22px rgba(124, 58, 237, 0.75); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="card">
      <div class="logo" id="logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
      </div>

      <!-- Loading / redirecting state -->
      <div id="view-loading">
        <h1>Authorize Cors.Connect</h1>
        <p class="sub">Tap the button below to complete authorization and return to app.</p>
        <button id="btn-return" class="btn-action">Return to App</button>
      </div>

      <!-- Error state: no initData after waiting. Most often this means the bot
           is not started yet (START not pressed) or a non-standard Telegram
           client — offer a direct link that starts the bot and relaunches the
           Mini App in one tap. -->
      <div id="view-error" class="error hidden">
        <h1 id="error-title">Telegram session not found</h1>
        <p class="sub" id="error-message">The bot must be started first.</p>
        <a id="btn-start-bot" class="btn-action" href="https://t.me/wl_cors_bot?startapp=auth">Start @wl_cors_bot</a>
        <p class="state-line">Press <strong>START</strong> if asked — the sign-in page reopens automatically.</p>
      </div>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      // Важно: Полноценная HTTPS ссылка для Android App Links (чтобы WebView не бросал ошибки)
      var HTTPS_HOST = "https://beta.cors-fox.cc/tginit";
      var PARAM = "initdata";
      // Сколько ждать появления initData, прежде чем решить, что страница
      // открыта не в Telegram (или бот не запущен): SDK грузится с
      // telegram.org и на медленной сети / нестандартных клиентах может
      // опаздывать на несколько секунд.
      var WAIT_SDK_MS = 5000;
      var POLL_MS = 200;

      var loadingView = document.getElementById("view-loading");
      var errorView = document.getElementById("view-error");
      var errorTitle = document.getElementById("error-title");
      var errorMessage = document.getElementById("error-message");
      var btnReturn = document.getElementById("btn-return");

      function showError(title, message) {
        loadingView.classList.add("hidden");
        errorView.classList.remove("hidden");
        if (title) errorTitle.textContent = title;
        if (message) errorMessage.textContent = message;
      }

      function looksLikeInitData(s) {
        if (!s || typeof s !== "string") return false;
        if (s.indexOf("hash=") === -1) return false;
        return (
          s.indexOf("auth_date=") !== -1 ||
          s.indexOf("query_id=") !== -1 ||
          s.indexOf("user=") !== -1
        );
      }

      function readInitData() {
        // 1. Основной путь: SDK загрузился и отдал подписанный initData.
        try {
          var waInit = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData;
          if (waInit) return waInit;
        } catch (e) {}

        // 2. Фолбэк: Telegram открывает Mini App как
        //    https://page/#tgWebAppData=<urlencoded initData>&tgWebAppVersion=...
        //    Читаем фрагмент напрямую — работает даже пока SDK не догрузился.
        try {
          var hash = window.location.hash || "";
          if (hash.charAt(0) === "#") hash = hash.slice(1);
          if (hash) {
            var v = new URLSearchParams(hash).get("tgWebAppData");
            if (v) return v;
          }
        } catch (e) {}

        // 3. Редкий случай: данные отдали в query-части, а не в hash.
        try {
          var q = window.location.search || "";
          if (q.charAt(0) === "?") q = q.slice(1);
          if (q) {
            var vq = new URLSearchParams(q).get("tgWebAppData");
            if (vq) return vq;
          }
        } catch (e) {}
        return "";
      }

      function deliverInitData(initData) {
        var wa = window.Telegram && window.Telegram.WebApp;

        // initdata кодируем ровно один раз: дальше значение читает страница
        // /tginit и приложение (Uri.decode).
        var targetUrl = HTTPS_HOST + "?" + PARAM + "=" + encodeURIComponent(initData);

        var doRedirect = function () {
          if (wa && typeof wa.openLink === "function") {
            try {
              wa.openLink(targetUrl, { try_instant_view: false });
              return;
            } catch (e) {
              /* openLink не принял ссылку — падаем на прямую навигацию */
            }
          }
          window.location.href = targetUrl;
        };

        // Переход ТОЛЬКО по нажатию кнопки. Авто-редирект через openLink
        // уводил (а на части клиентов закрывал) WebView раньше, чем
        // пользователь успевал увидеть кнопку; навигация по жесту
        // пользователя надёжнее доходит до Intent приложения.
        btnReturn.addEventListener("click", doRedirect);
      }

      function start() {
        try {
          var wa = window.Telegram && window.Telegram.WebApp;
          if (wa) {
            if (typeof wa.ready === "function") wa.ready();
            if (typeof wa.expand === "function") wa.expand();
          }
        } catch (e) {}

        // initData может появиться с задержкой. Опрашиваем до WAIT_SDK_MS и
        // только потом показываем кнопку запуска бота — раньше страница
        // ошибочно считала, что она открыта не в Telegram, и не редиректила.
        var waited = 0;
        var timer = setInterval(function () {
          var initData = readInitData();
          if (looksLikeInitData(initData)) {
            clearInterval(timer);
            deliverInitData(initData);
            return;
          }
          waited += POLL_MS;
          if (waited >= WAIT_SDK_MS) {
            clearInterval(timer);
            showError(
              "Telegram session not found",
              "Bot not started or unsupported client. Use the button below to start @wl_cors_bot."
            );
          }
        }, POLL_MS);
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", start);
      } else {
        start();
      }
    })();
  </script>
</body>
</html>
