<script>
(function () {
    "use strict";

    var SCHEME = "corsconnect";
    var HOST = "tginit";
    var PARAM = "initdata";
    var ANDROID_PACKAGE_NAME = "cc.cors.connect";

    var loadingView = document.getElementById("view-loading");
    var errorView = document.getElementById("view-error");
    var errorTitle = document.getElementById("error-title");
    var errorMessage = document.getElementById("error-message");
    var btnReturn = document.getElementById("btn-return");

    function showError(title, message) {
        loadingView.classList.add("hidden");
        errorView.classList.remove("hidden");
        if (title) errorTitle.textContent = title;
        if (message) errorMessage.textContent = message;
    }

    function looksLikeInitData(s) {
        if (!s || typeof s !== "string") return false;
        if (s.indexOf("hash=") === -1) return false;

        return (
            s.indexOf("auth_date=") !== -1 ||
            s.indexOf("query_id=") !== -1 ||
            s.indexOf("user=") !== -1
        );
    }

    function readInitData() {
        try {
            var wa = window.Telegram && window.Telegram.WebApp;
            if (wa && wa.initData)
                return wa.initData;
        } catch (e) {}

        try {
            var url = new URL(window.location.href.replace("#", "?"));
            var data = url.searchParams.get("tgWebAppData");
            if (data)
                return data;
        } catch (e) {}

        return "";
    }

    function setupClick(initData) {

        var encoded = encodeURIComponent(initData);

        var customUrl =
            SCHEME +
            "://" +
            HOST +
            "?" +
            PARAM +
            "=" +
            encoded;

        var intentUrl =
            "intent://" +
            HOST +
            "?" +
            PARAM +
            "=" +
            encoded +
            "#Intent;" +
            "scheme=" +
            SCHEME +
            ";" +
            "package=" +
            ANDROID_PACKAGE_NAME +
            ";" +
            "end";

        btnReturn.addEventListener("click", function () {

            var isAndroid = /android/i.test(navigator.userAgent);

            if (isAndroid) {

                window.location.href = customUrl;

                setTimeout(function () {
                    window.location.href = intentUrl;
                }, 700);

            } else {

                window.location.href = customUrl;
            }

            setTimeout(function () {
                try {
                    var wa = window.Telegram && window.Telegram.WebApp;
                    if (wa && typeof wa.close === "function")
                        wa.close();
                } catch (e) {}
            }, 1500);
        });
    }

    function start() {

        try {
            var wa = window.Telegram && window.Telegram.WebApp;

            if (wa) {
                if (typeof wa.ready === "function")
                    wa.ready();

                if (typeof wa.expand === "function")
                    wa.expand();
            }

        } catch (e) {}

        var initData = readInitData();

        if (!looksLikeInitData(initData)) {
            showError(
                "Open in Telegram",
                "This page only works inside the Telegram app."
            );
            return;
        }

        setupClick(initData);
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", start);
    } else {
        start();
    }

})();
</script>
