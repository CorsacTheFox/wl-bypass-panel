<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- Telegram WebApp SDK. Must load before any code that reads initData. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <title>Authorizing Cors.Connect…</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #08080a;
      color: #d1d5db;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }
    .wrap { width: 100%; max-width: 26rem; }
    .card {
      background: #14141a;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 18px;
      padding: 2.25rem 1.75rem;
      text-align: center;
    }
    .logo {
      width: 3.25rem; height: 3.25rem; border-radius: 14px;
      background: #7c3aed;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.35rem;
      box-shadow: 0 10px 28px rgba(124, 58, 237, 0.28);
    }
    h1 { color: #fff; font-size: 1.2rem; font-weight: 600; margin: 0 0 .5rem; }
    .sub { color: #6b7280; font-size: .82rem; margin: 0 0 1.5rem; line-height: 1.5; }

    /* Spinner (shown during the brief redirect) */
    .spinner {
      width: 30px; height: 30px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #7c3aed;
      border-radius: 50%;
      margin: 0 auto 1.1rem;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .state-line { color: #9ca3af; font-size: .82rem; margin: 0; }
    .state-line.strong { color: #e5e7eb; font-weight: 500; }

    /* Error state */
    .error .logo { background: #b91c1c; box-shadow: 0 10px 28px rgba(185, 28, 28, 0.25); }
    .error h1 { margin-bottom: .35rem; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="card">
      <div class="logo" id="logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
      </div>

      <!-- Loading / redirecting state -->
      <div id="view-loading">
        <h1>Authorizing Cors.Connect</h1>
        <p class="sub">Returning you to the app…</p>
        <div class="spinner" aria-label="loading"></div>
        <p class="state-line" id="status-loading">Preparing…</p>
      </div>

      <!-- Error state: opened outside Telegram, or no initData -->
      <div id="view-error" class="error hidden">
        <h1 id="error-title">Open in Telegram</h1>
        <p class="sub" id="error-message">This page only works inside the Telegram app.</p>
        <p class="state-line">Open <strong>@wl_cors_bot</strong> from Telegram to sign in.</p>
      </div>
    </div>
  </div>

  <script>
    // CORS.Connect → Android authorization bridge.
    //
    // Single responsibility: read the Telegram WebApp initData that Telegram
    // injects when this Mini App is loaded inside Telegram, and hand it back to
    // the Android app via the deep link:
    //
    //   corsconnect://tginit?initdata=<URL-ENCODED initData>
    //
    // The Android app validates the initData shape on receipt and later POSTs it
    // to /api/app/instances/{id}/claim, where the server validates the HMAC
    // signature. This page does NOT validate the signature — it only forwards
    // the raw, complete initData. See docs/ANDROID_INTEGRATION.md.

    (function () {
      "use strict";

      var SCHEME = "corsconnect";
      var HOST = "tginit";
      var PARAM = "initdata"; // Android accepts "initData" too, but use lowercase.
      var DEEP_LINK = SCHEME + "://" + HOST + "?" + PARAM + "=";

      var statusEl = document.getElementById("status-loading");
      var loadingView = document.getElementById("view-loading");
      var errorView = document.getElementById("view-error");
      var errorTitle = document.getElementById("error-title");
      var errorMessage = document.getElementById("error-message");
      var card = document.getElementById("card");

      function setStatus(text) {
        if (statusEl) statusEl.textContent = text;
      }

      function showError(title, message) {
        loadingView.classList.add("hidden");
        errorView.classList.remove("hidden");
        if (title) errorTitle.textContent = title;
        if (message) errorMessage.textContent = message;
        try { setStatus(""); } catch (e) {}
      }

      // initData is a non-empty query string containing at least hash= and one
      // of auth_date= / query_id= / user=. If absent or malformed, the Mini App
      // was almost certainly opened outside Telegram.
      function looksLikeInitData(s) {
        if (!s || typeof s !== "string") return false;
        if (s.indexOf("hash=") === -1) return false;
        return (
          s.indexOf("auth_date=") !== -1 ||
          s.indexOf("query_id=") !== -1 ||
          s.indexOf("user=") !== -1
        );
      }

      function readInitData() {
        // 1. JS API (preferred).
        try {
          var waInit = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData;
          if (waInit) return waInit;
        } catch (e) { /* fall through to URL parsing */ }

        // 2. URL parameter fallback: Telegram appends tgWebAppData=<URL-encoded
        //    initData> to the Mini App URL (in the hash for t.me links, in the
        //    query for direct https URLs). Check both.
        try {
          var loc = window.location.href;
          // Collect from both search and hash.
          var fromHash = new URL(loc.replace("#", "?")); // normalize #tgWebAppData= -> ?tgWebAppData=
          var v = fromHash.searchParams.get("tgWebAppData");
          if (v) return v;
        } catch (e) { /* ignore */ }
        return "";
      }

      function deliverInitData(initData) {
        // encodeURIComponent is critical: initData itself is a query string and
        // contains & and = — without encoding, those would corrupt the outer
        // corsconnect:// URL. The Android app calls Uri.decode on receipt.
        var url = DEEP_LINK + encodeURIComponent(initData);
        var wa = window.Telegram && window.Telegram.WebApp;

        // openLink is the only reliable cross-version way to break out of
        // Telegram's in-app WebView to a custom scheme. Fall back to a direct
        // navigation for very old clients / standalone browsers.
        if (wa && typeof wa.openLink === "function") {
          try {
            wa.openLink(url);
            setStatus("Redirecting to Cors.Connect…");
            return;
          } catch (e) {
            /* fall through to location fallback */
          }
        }
        window.location.href = url;
        setStatus("Redirecting to Cors.Connect…");
      }

      function start() {
        // Tell Telegram we're ready and want the full viewport.
        try {
          var wa = window.Telegram && window.Telegram.WebApp;
          if (wa) {
            if (typeof wa.ready === "function") wa.ready();
            if (typeof wa.expand === "function") wa.expand();
          }
        } catch (e) { /* non-fatal */ }

        var initData = readInitData();

        if (!looksLikeInitData(initData)) {
          // Opened outside Telegram (or initData not injected yet).
          showError("Open in Telegram", "This page only works inside the Telegram app.");
          return;
        }

        setStatus("Sending authorization to Cors.Connect…");
        deliverInitData(initData);

        // The flow is one-way: once the redirect fires, control passes to the
        // Android app. Show a brief confirmation and close the Mini App. Don't
        // wait for a response — there isn't one.
        setTimeout(function () {
          try {
            var wa = window.Telegram && window.Telegram.WebApp;
            if (wa && typeof wa.close === "function") wa.close();
          } catch (e) { /* ignore */ }
        }, 1200);
      }

      // Kick off as soon as the DOM is ready.
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", start);
      } else {
        start();
      }
    })();
  </script>
</body>
</html>
