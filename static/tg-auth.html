<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <title>Authorizing Cors.Connect…</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #08080a;
      color: #d1d5db;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }
    .wrap { width: 100%; max-width: 26rem; }
    .card {
      background: #14141a;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 18px;
      padding: 2.25rem 1.75rem;
      text-align: center;
    }
    .logo {
      width: 3.25rem; height: 3.25rem; border-radius: 14px;
      background: #7c3aed;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.35rem;
      box-shadow: 0 10px 28px rgba(124, 58, 237, 0.28);
    }
    h1 { color: #fff; font-size: 1.2rem; font-weight: 600; margin: 0 0 .5rem; }
    .sub { color: #6b7280; font-size: .82rem; margin: 0 0 1.25rem; line-height: 1.5; }
    .spinner {
      width: 30px; height: 30px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #7c3aed;
      border-radius: 50%;
      margin: 0 auto 1.1rem;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .state-line { color: #9ca3af; font-size: .82rem; margin: 0; }
    .error .logo { background: #b91c1c; box-shadow: 0 10px 28px rgba(185, 28, 28, 0.25); }
    .error h1 { margin-bottom: .35rem; }
    .hidden { display: none !important; }
    .btn-action {
      display: inline-block;
      width: 100%;
      padding: 0.85rem 1.25rem;
      margin-top: 1rem;
      background: #7c3aed;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.35);
      transition: background 0.2s ease;
    }
    .btn-action:active { background: #6d28d9; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="card">
      <div class="logo" id="logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
      </div>

      <div id="view-loading">
        <h1>Authorizing Cors.Connect</h1>
        <p class="sub">Returning you to the app…</p>
        <div class="spinner" id="spinner" aria-label="loading"></div>
        <p class="state-line" id="status-loading">Preparing…</p>
        <button id="btn-return" class="btn-action hidden">Open Cors.Connect App</button>
      </div>

      <div id="view-error" class="error hidden">
        <h1 id="error-title">Open in Telegram</h1>
        <p class="sub" id="error-message">This page only works inside the Telegram app.</p>
        <p class="state-line">Open <strong>@wl_cors_bot</strong> from Telegram to sign in.</p>
      </div>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      var SCHEME = "corsconnect";
      var HOST = "tginit";
      var PARAM = "initdata";

      var statusEl = document.getElementById("status-loading");
      var loadingView = document.getElementById("view-loading");
      var errorView = document.getElementById("view-error");
      var errorTitle = document.getElementById("error-title");
      var errorMessage = document.getElementById("error-message");
      var btnReturn = document.getElementById("btn-return");

      function setStatus(text) {
        if (statusEl) statusEl.textContent = text;
      }

      function showError(title, message) {
        loadingView.classList.add("hidden");
        errorView.classList.remove("hidden");
        if (title) errorTitle.textContent = title;
        if (message) errorMessage.textContent = message;
        try { setStatus(""); } catch (e) {}
      }

      function looksLikeInitData(s) {
        if (!s || typeof s !== "string") return false;
        if (s.indexOf("hash=") === -1) return false;
        return (
          s.indexOf("auth_date=") !== -1 ||
          s.indexOf("query_id=") !== -1 ||
          s.indexOf("user=") !== -1
        );
      }

      function readInitData() {
        try {
          var waInit = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData;
          if (waInit) return waInit;
        } catch (e) {}

        try {
          var loc = window.location.href;
          var fromHash = new URL(loc.replace("#", "?"));
          var v = fromHash.searchParams.get("tgWebAppData");
          if (v) return v;
        } catch (e) {}
        return "";
      }

      function deliverInitData(initData) {
        var encodedData = encodeURIComponent(initData);
        var customSchemeUrl = SCHEME + "://" + HOST + "?" + PARAM + "=" + encodedData;
        var intentUrl = "intent://" + HOST + "?" + PARAM + "=" + encodedData + "#Intent;scheme=" + SCHEME + ";end";

        var isAndroid = /android/i.test(navigator.userAgent);
        var targetUrl = isAndroid ? intentUrl : customSchemeUrl;

        function doRedirect() {
          var wa = window.Telegram && window.Telegram.WebApp;
          
          if (wa && typeof wa.openLink === "function") {
            try {
              wa.openLink(targetUrl);
              return;
            } catch (e) {
              try {
                wa.openLink(customSchemeUrl);
                return;
              } catch (e2) {}
            }
          }
          
          window.location.href = customSchemeUrl;
        }

        if (btnReturn) {
          btnReturn.classList.remove("hidden");
          btnReturn.onclick = function () {
            doRedirect();
          };
        }

        setStatus("Redirecting to Cors.Connect…");

        try {
          doRedirect();
        } catch (e) {}
      }

      function start() {
        try {
          var wa = window.Telegram && window.Telegram.WebApp;
          if (wa) {
            if (typeof wa.ready === "function") wa.ready();
            if (typeof wa.expand === "function") wa.expand();
          }
        } catch (e) {}

        var initData = readInitData();

        if (!looksLikeInitData(initData)) {
          showError("Open in Telegram", "This page only works inside the Telegram app.");
          return;
        }

        deliverInitData(initData);
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", start);
      } else {
        start();
      }
    })();
  </script>
</body>
</html>
